<!DOCTYPE html>
<html>
<head>
    <title>Shoe Store Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>👟 Shoe Store</h1>
    <p>Find Your Perfect Style</p>
</header>

<section class="products">

    <div class="card">
        <img src="https://via.placeholder.com/200">
        <h3>Nike Air</h3>
        <p>₹3000</p>
        <button onclick="order('Nike Air')">Order Now</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200">
        <h3>Adidas Run</h3>
        <p>₹3500</p>
        <button onclick="order('Adidas Run')">Order Now</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200">
        <h3>Puma Flex</h3>
        <p>₹2800</p>
        <button onclick="order('Puma Flex')">Order Now</button>
    </div>

</section>

<section id="result"></section>

<footer>
    <p>© 2026 Shoe Store | Designed by You</p>
</footer>

<script src="script.js"></script>
</body>
</html>
